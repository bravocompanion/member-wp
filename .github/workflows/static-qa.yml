name: Static Pages QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Periksa sintaks JavaScript
        run: |
          node --check static/app.js
          node --check static/v04.js
          node --check static/v05.js
          node --check static/v051.js
          node --check static/v06.js
          node --check static/v06-safe.js
          node --check static/v061.js
          node --check static/v09.js
          node --check static/v091.js
          node --check static/v091-safe.js
          node --check static/v092.js
          node --check functions/api/member-wp.js
      - name: Build bundle Cloudflare Pages
        run: npm run build
      - name: Verifikasi v0.9.2 dan bahasa sehari-hari
        run: |
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/v09.js
          test -f dist/v091.js
          test -f dist/v091-safe.js
          test -f dist/v092.js
          test -f dist/v09.css
          test -f dist/_headers
          test -f functions/api/member-wp.js
          test -f supabase/migrations/006_member_wp_app_login.sql
          test -f supabase/functions/member-wp-personal-api/index.ts
          node - <<'NODE'
          const fs=require('fs')
          const html=fs.readFileSync('dist/index.html','utf8')
          const htmlLower=html.toLowerCase()
          const order=['app.js','v04.js','v05.js','v051.js','v06.js','v06-safe.js','v061.js','v09.js','v091.js','v091-safe.js','v092.js'].map(x=>html.indexOf(x))
          if(order.some(x=>x<0)||!order.every((x,i)=>i===0||x>order[i-1])) throw new Error('Urutan skrip tidak benar')
          const pkg=require('./package.json')
          if(pkg.version!=='0.9.2') throw new Error(`Versi tidak sesuai: ${pkg.version}`)
          if(!html.includes('v0.9.2')) throw new Error('Penanda v0.9.2 tidak ditemukan')
          for(const term of ['database pribadi','username','password','kontrol wp v0.9.2','hari ini','batas waktu','backup','follow-up']) if(!htmlLower.includes(term)) throw new Error(`Istilah sehari-hari tidak ditemukan: ${term}`)
          for(const term of ['Basis Data Pribadi','Nama Pengguna','Kata Sandi','Pusat Kendali','Dasbor Hari Ini','>Cadangan<','tenggat, dan tindak lanjut']) if(html.includes(term)) throw new Error(`Istilah terlalu baku masih ada di shell: ${term}`)
          const v092=fs.readFileSync('dist/v092.js','utf8')
          for(const marker of ['Bahasa Indonesia sehari-hari','Batas Waktu','Data Login','Menunggu Dicek','Belum Dikerjakan','Sedang Dikerjakan','Database','Backup','Online','Offline','PIC','Checklist']) if(!v092.includes(marker)) throw new Error(`Penanda bahasa sehari-hari hilang: ${marker}`)
          const v09=fs.readFileSync('dist/v09.js','utf8')
          for(const marker of ['action=login','action=logout','action=bootstrap','v09Credential','v09WipeLocal']) if(!v09.includes(marker)) throw new Error(`Penanda login hilang: ${marker}`)
          for(const forbidden of ['service_role','sb_secret_','SUPABASE_SERVICE_ROLE_KEY','#activate=','member_wp_device']) if(v09.includes(forbidden)) throw new Error(`Penanda terlarang di Browser: ${forbidden}`)
          const bridge=fs.readFileSync('functions/api/member-wp.js','utf8')
          for(const marker of ['member_wp_session','HttpOnly','SameSite=Strict','action===\'login\'','x-member-wp-session']) if(!bridge.includes(marker)) throw new Error(`Penanda API login hilang: ${marker}`)
          const edge=fs.readFileSync('supabase/functions/member-wp-personal-api/index.ts','utf8')
          for(const marker of ['member_wp_app_auth','PBKDF2','x-member-wp-session','makeSession','SUPABASE_SERVICE_ROLE_KEY']) if(!edge.includes(marker)) throw new Error(`Penanda backend login hilang: ${marker}`)
          const combined=html+v09+v092+bridge+edge
          if(combined.includes('bravo@911')) throw new Error('Password asli tidak boleh ada di source repository')
          NODE
