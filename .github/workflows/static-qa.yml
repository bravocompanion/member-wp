name: Static Pages QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Periksa sintaks JavaScript
        run: |
          node --check static/app.js
          node --check static/v09.js
          node --check static/v011.js
          node --check static/v011-sanitize.js
          node --check functions/api/member-wp.js

      - name: Build bundle Cloudflare Pages
        run: npm run build

      - name: Verifikasi v0.12 Cloudflare D1
        run: |
          test -f dist/index.html
          test -f dist/v011.js
          test -f dist/v011-sanitize.js
          test -f dist/v011.css
          test -f dist/_headers
          test -f functions/api/member-wp.js
          test -f d1/schema.sql
          node - <<'NODE'
          const fs=require('fs')
          const html=fs.readFileSync('dist/index.html','utf8')
          const pkg=require('./package.json')
          if(pkg.version!=='0.12.0') throw new Error('Versi harus 0.12.0')

          for(const marker of ['Monitoring Coretax DJP','Checklist mingguan semua WP','v011.js','v011-sanitize.js']) {
            if(!html.includes(marker)) throw new Error('Marker checklist hilang: '+marker)
          }
          for(const old of ['v010.js','v0101.js','v06.js','v061.js','Data Login WP','Arsip Dokumen']) {
            if(html.includes(old)) throw new Error('Fitur lama masih dimuat: '+old)
          }

          const sync=fs.readFileSync('dist/v09.js','utf8')
          for(const marker of ['Cloudflare D1',"new Set(['taxpayers','tasks'])",'database_not_bound']) {
            if(!sync.includes(marker)) throw new Error('D1 sync marker hilang: '+marker)
          }

          const v011=fs.readFileSync('dist/v011.js','utf8')
          for(const marker of ['CORETAX_DJP_WEEKLY','Monitoring Coretax DJP','weekly_monitoring','Sudah Dicek','Belum Dicek','v011EnsureWeek']) {
            if(!v011.includes(marker)) throw new Error('Checklist marker hilang: '+marker)
          }

          const sanitize=fs.readFileSync('dist/v011-sanitize.js','utf8')
          for(const marker of ["['npwp','phone','email','pic','nik','kk']",'profiles','notes','activities','weekly_monitoring']) {
            if(!sanitize.includes(marker)) throw new Error('Sanitizer marker hilang: '+marker)
          }

          const api=fs.readFileSync('functions/api/member-wp.js','utf8')
          for(const marker of ['env.DB','MEMBER_WP_USERNAME','MEMBER_WP_PASSWORD','SESSION_SECRET','member_wp_records',"new Set(['taxpayers','tasks'])",'sanitizeTaxpayer','sanitizeTask']) {
            if(!api.includes(marker)) throw new Error('Backend D1 marker hilang: '+marker)
          }
          for(const forbidden of ['supabase.co','CREDENTIAL_UPSTREAM','credential-upsert','credential-delete','member_wp_single_credentials','member_wp_archives']) {
            if(api.includes(forbidden)) throw new Error('Dependency/route lama masih aktif: '+forbidden)
          }

          const schema=fs.readFileSync('d1/schema.sql','utf8')
          for(const marker of ['CREATE TABLE IF NOT EXISTS member_wp_records','PRIMARY KEY (collection, record_id)']) {
            if(!schema.includes(marker)) throw new Error('D1 schema tidak lengkap: '+marker)
          }
          NODE
