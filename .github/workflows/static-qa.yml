name: Static Pages QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/v04.js
          node --check static/v05.js
          node --check static/v051.js
          node --check static/v06.js
          node --check static/v06-safe.js
          node --check static/v061.js
          node --check static/v07.js
      - name: Build static Pages bundle
        run: npm run build
      - name: Verify output and integration order
        run: |
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/app.css
          test -f dist/v04.js
          test -f dist/v05.js
          test -f dist/v051.js
          test -f dist/v06.js
          test -f dist/v06-safe.js
          test -f dist/v061.js
          test -f dist/v07.js
          test -f dist/v07.css
          test -f dist/_headers
          test -f supabase/migrations/003_member_wp_cloud_sync.sql
          node - <<'NODE'
          const fs=require('fs')
          const html=fs.readFileSync('dist/index.html','utf8')
          const order=['app.js','v04.js','v05.js','v051.js','v06.js','v06-safe.js','v061.js','@supabase/supabase-js@2.112.3','v07.js'].map(x=>html.indexOf(x))
          if(order.some(x=>x<0)||!order.every((x,i)=>i===0||x>order[i-1])) throw new Error('Static script integration order is invalid')
          const pkg=require('./package.json')
          if(pkg.version!=='0.7.0') throw new Error(`Unexpected version ${pkg.version}`)
          if(!html.includes('v0.7')) throw new Error('v0.7 shell marker missing')
          const v07=fs.readFileSync('dist/v07.js','utf8')
          for(const marker of ['signInWithPassword','signUp','member_wp_records','member_wp_sync_state','v07PushAll','v07PullAll','V07_SUPABASE_PUBLISHABLE_KEY']) if(!v07.includes(marker)) throw new Error(`Missing v0.7 marker: ${marker}`)
          if(v07.includes('service_role')||v07.includes('sb_secret_')) throw new Error('Privileged Supabase key marker found in browser code')
          const migration=fs.readFileSync('supabase/migrations/003_member_wp_cloud_sync.sql','utf8')
          for(const marker of ['enable row level security','revoke all on public.member_wp_records from anon','to authenticated','auth.uid()']) if(!migration.toLowerCase().includes(marker.toLowerCase())) throw new Error(`Missing migration security marker: ${marker}`)
          NODE
