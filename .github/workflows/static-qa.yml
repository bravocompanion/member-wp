name: Static Pages QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/v04.js
          node --check static/v05.js
          node --check static/v051.js
      - name: Build static Pages bundle
        run: npm run build
      - name: Verify output and integration order
        run: |
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/app.css
          test -f dist/v04.js
          test -f dist/v04.css
          test -f dist/v05.js
          test -f dist/v05.css
          test -f dist/v051.js
          test -f dist/v051.css
          test -f dist/_headers
          node - <<'NODE'
          const fs=require('fs')
          const html=fs.readFileSync('dist/index.html','utf8')
          const order=['app.js','v04.js','v05.js','v051.js'].map(x=>html.indexOf(x))
          if(order.some(x=>x<0)||!order.every((x,i)=>i===0||x>order[i-1])) throw new Error('Static script integration order is invalid')
          const pkg=require('./package.json')
          if(pkg.version!=='0.5.1') throw new Error(`Unexpected version ${pkg.version}`)
          if(!html.includes('v0.5.1')) throw new Error('v0.5.1 shell marker missing')
          const audit=fs.readFileSync('dist/v051.js','utf8')
          for(const marker of ['Data Health Audit','Restore atomik','v051AuditData']) if(!audit.includes(marker)) throw new Error(`Missing audit marker: ${marker}`)
          NODE
